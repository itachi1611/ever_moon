# Keeps the pinned GitHub Actions current. Every third-party action is pinned
# to a full commit SHA with its version in a trailing comment; Dependabot
# opens one pull request a month that moves the SHAs and the comments.
version: 2
updates:
  - package-ecosystem: github-actions
    # Workflows are found from "/"; the local composite action has its own
    # uses: lines and must be listed to be scanned.
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      # Monthly runs on the first day of the month; "day" only exists for weekly.
      interval: monthly
    # A new major version of an action can change its runtime or inputs, so
    # majors are moved by hand, after reading the release notes.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      # Pull request titles must be Conventional Commits.
      prefix: "chore(ci)"
