# Checks every pull request and every push to main: analyze and tests.
# It never publishes; builds for testers come from distribute-dev.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same Flutter as the local fvm setup.
  FLUTTER_VERSION: "3.47.1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # assets/env/.env.* are gitignored but listed as assets in pubspec.yaml.
      # They hold no secret, so the committed examples are enough here.
      - name: Create env files from the examples
        run: |
          cp -n assets/env/.env.dev.example assets/env/.env.dev
          cp -n assets/env/.env.prod.example assets/env/.env.prod

      - name: Install dependencies
        run: flutter pub get

      # *.g.dart is gitignored; the Drift database and the API client need it.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test app
        run: flutter test

      - name: Test lunar_calendar package
        working-directory: packages/lunar_calendar
        run: |
          dart pub get
          dart test
