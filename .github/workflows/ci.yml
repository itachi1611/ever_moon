# Checks every pull request into main: formatting, analyze and tests, a
# SonarQube Cloud scan whose quality gate must pass, plus a smoke check of the
# fastlane setup. It also runs on main after a merge, so Sonar has a baseline to
# compare pull requests with. It never publishes; releases come from
# distribute.yml. Tool versions come from pubspec.yaml, .ruby-version and
# .java-version, not from this file.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Sonar needs the history to tell new code from old code.
          fetch-depth: 0

      - name: Set up toolchain
        uses: ./.github/actions/setup
        with:
          ruby: "true"

      - name: Verify the app
        uses: ./.github/actions/verify
        with:
          coverage: "true"

      # A pull request from a fork or from Dependabot gets no secret; the scan
      # is skipped there instead of failing.
      - name: Check for the Sonar token
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SONAR_TOKEN is not available; the SonarQube scan is skipped"
          fi

      # The step fails when the quality gate fails, so the required check
      # `check` blocks the merge. The organization and project key are
      # repository variables (docs/ci-cd.md).
      - name: SonarQube Cloud scan
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Test the fastlane helpers
        run: bundle exec ruby fastlane/test/evermoon_test.rb

      # Loads the real Fastfile; fails on a syntax or load error.
      - name: List the lanes
        run: bundle exec fastlane lanes

      # Versions, Firebase app ids and tester groups have one source each
      # (docs/ci-cd.md); they must not be copied into workflows or the Fastfile.
      # [:] keeps a pattern from matching its own text.
      - name: No hard-coded values
        run: |
          if grep -rnE \
              -e "flutter-version[:] *[\"']?[0-9]" \
              -e "java-version[:] *[\"']?[0-9]" \
              -e "ruby-version[:] *[\"']?[0-9]" \
              -e '[0-9]+:[0-9]{9,}:(android|ios):' \
              -e 'groups: *"' \
              .github fastlane/Fastfile; then
            echo "::error::A version, app id or tester group is written in a workflow or the Fastfile"
            exit 1
          fi
