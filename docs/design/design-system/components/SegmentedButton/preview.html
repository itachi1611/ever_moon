<!-- @dsCard group="Controls" height=150 -->
<style>.root{background:var(--surface);color:var(--on-surface);padding:var(--space-16);display:flex;flex-direction:column;gap:var(--space-12);font-family:var(--font-body)}</style>
<div class="root">
 <div role="radiogroup" aria-label="Ngôn ngữ" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--outline);border-radius:var(--corner-full);overflow:hidden"><button type="button" role="radio" aria-checked="true" class="label-large" style="height:var(--button);border:0;border-right:1px solid var(--outline);background:var(--secondary-container);color:var(--on-secondary-container);font-family:inherit">Tiếng Việt</button><button type="button" role="radio" aria-checked="false" class="label-large" style="height:var(--button);border:0;background:transparent;color:var(--on-surface);font-family:inherit">English</button></div>
 <div role="radiogroup" aria-label="Giao diện" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--outline);border-radius:var(--corner-full);overflow:hidden"><button type="button" role="radio" aria-checked="false" class="label-large" style="height:var(--button);border:0;border-right:1px solid var(--outline);background:transparent;color:var(--on-surface);font-family:inherit">Hệ thống</button><button type="button" role="radio" aria-checked="false" class="label-large" style="height:var(--button);border:0;border-right:1px solid var(--outline);background:transparent;color:var(--on-surface);font-family:inherit">Sáng</button><button type="button" role="radio" aria-checked="true" class="label-large" style="height:var(--button);border:0;background:var(--secondary-container);color:var(--on-secondary-container);font-family:inherit">Tối</button></div>
</div>
<script>/* static preview */</script>
