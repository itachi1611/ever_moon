<!-- @dsCard group="Calendar" height=330 -->
<style>.root{background:var(--surface);color:var(--on-surface);padding:var(--space-16);display:flex;flex-direction:column;gap:var(--space-8);font-family:var(--font-body)}</style>
<div class="root">
 <div style="min-height:60px;box-sizing:border-box;padding:12px 16px;border-radius:var(--corner-medium);background:var(--surface-container-low);border:1px solid var(--outline-variant);display:flex;align-items:center;gap:var(--space-12)"><span style="width:10px;height:10px;border-radius:5px;background:var(--anniversary-mark)"></span><span style="flex:1;display:flex;flex-direction:column"><span class="title-medium">Cô Ba</span><span class="body-medium" style="color:var(--on-surface-variant)">Nhắc trước 3 ngày, lúc 19:00</span></span><span class="label-medium" style="padding:4px 12px;border-radius:var(--corner-small);background:var(--surface-container-highest)">Ngày giỗ</span></div>
 <div style="position:relative;border-radius:var(--corner-medium);overflow:hidden;background:var(--primary)"><div style="position:absolute;right:0;top:0;bottom:0;width:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--on-primary)" class="label-large">Sửa</div><div style="transform:translateX(-96px);min-height:60px;box-sizing:border-box;padding:12px 16px;background:var(--surface-container-low);border:1px solid var(--outline-variant);border-radius:var(--corner-medium);display:flex;align-items:center;gap:var(--space-12)"><span style="width:10px;height:10px;border-radius:5px;background:var(--anniversary-mark)"></span><span class="title-medium">Bà nội</span></div></div>
 <div style="position:relative;border-radius:var(--corner-medium);overflow:hidden;background:var(--error)"><div style="position:absolute;left:0;top:0;bottom:0;width:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--on-error)" class="label-large">Xoá</div><div style="transform:translateX(96px);min-height:60px;box-sizing:border-box;padding:12px 16px;background:var(--surface-container-low);border:1px solid var(--outline-variant);border-radius:var(--corner-medium);display:flex;align-items:center;gap:var(--space-12)"><span style="width:10px;height:10px;border-radius:5px;background:var(--anniversary-mark)"></span><span class="title-medium">Ông nội</span></div></div>
 <div style="min-height:60px;box-sizing:border-box;padding:12px 16px;border-radius:var(--corner-medium);background:var(--holiday-container);color:var(--on-holiday-container);display:flex;align-items:center;gap:var(--space-12)"><span style="width:10px;height:10px;border-radius:5px;background:var(--holiday-mark)"></span><span style="flex:1;display:flex;flex-direction:column"><span class="title-medium">Rằm tháng 10</span><span class="body-medium">Ngày lễ hằng tháng</span></span><span class="label-medium" style="padding:4px 12px;border-radius:var(--corner-small);border:1px solid var(--holiday-mark)">Ngày lễ</span></div>
</div>
<script>/* static preview */</script>
