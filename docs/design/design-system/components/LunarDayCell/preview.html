<!-- @dsCard group="Calendar" height=150 -->
<style>.root{background:var(--surface);color:var(--on-surface);padding:var(--space-16);display:flex;flex-direction:column;gap:var(--space-12);font-family:var(--font-body)}</style>
<div class="root" style="flex-direction:row;gap:var(--space-8)">
 <div style="width:48px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center"><span class="body-large">5</span><span class="body-small" style="color:var(--on-surface-variant)">26</span><span style="height:6px"></span></div>
 <div style="width:48px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--corner-medium);background:var(--primary);color:var(--on-primary)"><span class="body-large" style="font-weight:700">6</span><span class="body-small">27</span><span style="width:6px;height:6px;border-radius:3px;background:var(--on-primary)"></span></div>
 <div style="width:48px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center"><span class="body-large">10</span><span class="body-small" style="color:var(--holiday-mark);font-weight:700">1/10</span><span style="width:6px;height:6px;border-radius:3px;background:var(--holiday-mark)"></span></div>
 <div style="width:48px;height:56px;box-sizing:border-box;border:2px solid var(--primary);border-radius:var(--corner-medium);display:flex;flex-direction:column;align-items:center;justify-content:center"><span class="body-large">24</span><span class="body-small" style="color:var(--holiday-mark);font-weight:700">15</span><span style="display:flex;gap:4px"><span style="width:6px;height:6px;border-radius:3px;background:var(--anniversary-mark)"></span><span style="width:6px;height:6px;border-radius:3px;background:var(--holiday-mark)"></span></span></div>
</div>
