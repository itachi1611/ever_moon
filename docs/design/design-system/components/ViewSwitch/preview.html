<!-- @dsCard group="Calendar" height=100 -->
<style>.root{background:var(--surface);color:var(--on-surface);padding:var(--space-16);display:flex;flex-direction:column;gap:var(--space-12);font-family:var(--font-body)}</style>
<div class="root">
 <div role="tablist" aria-label="Kiểu xem" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--outline);border-radius:var(--corner-full);overflow:hidden">
  <button role="tab" aria-selected="false" class="label-large" style="height:var(--button);border:0;border-right:1px solid var(--outline);background:transparent;color:var(--on-surface);font-family:var(--font-body)">Năm</button>
  <button role="tab" aria-selected="true" class="label-large" style="height:var(--button);border:0;border-right:1px solid var(--outline);background:var(--secondary-container);color:var(--on-secondary-container);font-weight:600;font-family:var(--font-body)">Tháng</button>
  <button role="tab" aria-selected="false" class="label-large" style="height:var(--button);border:0;background:transparent;color:var(--on-surface);font-family:var(--font-body)">Tuần</button>
 </div>
</div>
<script>/* static preview */</script>
