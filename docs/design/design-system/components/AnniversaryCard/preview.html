<style>.root{background:var(--surface);color:var(--on-surface);padding:var(--space-16);display:flex;flex-direction:column;gap:var(--space-12);font-family:var(--font-body)}</style>
<div class="root">
 <article style="display:flex;gap:var(--space-12);align-items:center;padding:var(--space-16);border-radius:var(--corner-medium);background:var(--today-container);color:var(--on-today-container)">
  <div style="width:var(--date-badge-width);height:var(--date-badge-height);flex:none;border-radius:var(--corner-medium);background:var(--primary);color:var(--on-primary);display:flex;flex-direction:column;align-items:center;justify-content:center"><span class="title-large" style="font-family:var(--font-body);font-weight:700">10</span><span class="label-medium">tháng 4</span></div>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span class="title-medium">Ông nội</span><span class="body-medium" style="color:var(--on-today-container-variant)">10 tháng 4 âm lịch</span><span class="body-medium" style="color:var(--on-today-container-variant)">Thứ Sáu, 06/11/2026</span></div>
  <span class="label-large" style="padding:8px 12px;border-radius:var(--corner-full);background:var(--primary);color:var(--on-primary)">Hôm nay</span>
 </article>
 <article style="display:flex;gap:var(--space-12);align-items:center;padding:var(--space-16);border-radius:var(--corner-medium);background:var(--surface-container-low);border:1px solid var(--outline-variant)">
  <div style="width:var(--date-badge-width);height:var(--date-badge-height);flex:none;border-radius:var(--corner-medium);background:var(--surface-container-highest);display:flex;flex-direction:column;align-items:center;justify-content:center"><span class="title-large" style="font-family:var(--font-body);font-weight:700">22</span><span class="label-medium" style="color:var(--on-surface-variant)">tháng 4</span></div>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span class="title-medium">Bà nội</span><span class="body-medium" style="color:var(--on-surface-variant)">22 tháng 4 âm lịch</span><span class="body-medium" style="color:var(--on-surface-variant)">Thứ Tư, 18/11/2026</span></div>
  <div style="display:flex;flex-direction:column;align-items:flex-end"><span class="title-large" style="font-family:var(--font-body);font-weight:700;color:var(--primary)">12</span><span class="label-medium" style="color:var(--on-surface-variant)">ngày nữa</span></div>
 </article>
</div>
