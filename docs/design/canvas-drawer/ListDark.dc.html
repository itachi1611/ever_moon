<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Ngày giỗ sắp tới (tối)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Lora:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin: 0}
a{color:#C1C1FF}a:hover{color:#E1DFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; background: #131318; color: #E4E1E9; font-family: 'Be Vietnam Pro', system-ui, sans-serif; overflow: hidden">
  <header style="padding: 24px 16px 12px; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 4px; margin-left: -12px"><a href="DrawerOpenDark.dc.html" aria-label="Mở menu" style="width: 48px; height: 48px; flex: none; border-radius: 24px; color: #E4E1E9; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></a><h1 style="margin: 0; font-family: Lora, Georgia, serif; font-size: 24px; line-height: 32px; font-weight: 400; letter-spacing: -0.2px">Ngày giỗ sắp tới</h1></div>
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: #C7C5D3">4 người · 1 ngày giỗ hôm nay</p>
  </header>

  <main style="flex: 1; padding: 8px 16px 120px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <h2 style="margin: 8px 4px 0; font-size: 14px; line-height: 20px; font-family: Lora, Georgia, serif; font-weight: 500; letter-spacing: 0.1px; color: #C7C5D3">Hôm nay</h2>
    <article style="display: flex; gap: 16px; align-items: center; padding: 16px; border-radius: 12px; background: #ECE1D1; color: #201B11">
      <div style="width: 56px; height: 64px; flex: none; border-radius: 12px; background: #C1C1FF; color: #24227C; display: flex; flex-direction: column; align-items: center; justify-content: center">
        <span style="font-size: 24px; line-height: 28px; font-weight: 700">27</span>
        <span style="font-size: 12px; line-height: 16px; font-weight: 600">tháng 9</span>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: Lora, Georgia, serif; font-size: 16px; line-height: 24px; font-weight: 500">Ông nội</span>
        <span style="font-size: 14px; line-height: 20px; color: #4D463A">27 tháng 9 âm lịch</span>
        <span style="font-size: 14px; line-height: 20px; color: #4D463A">Thứ Sáu, 06/11/2026</span>
      </div>
      <span style="flex: none; padding: 8px 12px; border-radius: 999px; background: #C1C1FF; color: #24227C; font-size: 14px; line-height: 20px; font-weight: 600">Hôm nay</span>
    </article>

    <h2 style="margin: 12px 4px 0; font-size: 14px; line-height: 20px; font-family: Lora, Georgia, serif; font-weight: 500; letter-spacing: 0.1px; color: #C7C5D3">Sắp tới</h2>
    <sc-for list="{{items}}" as="item" hint-placeholder-count="3">
      <article style="display: flex; gap: 16px; align-items: center; padding: 16px; border-radius: 12px; background: #1B1B21; border: 1px solid #464651">
        <div style="width: 56px; height: 64px; flex: none; border-radius: 12px; background: #35343A; color: #E4E1E9; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <span style="font-size: 24px; line-height: 28px; font-weight: 700">{{item.day}}</span>
          <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #C7C5D3">{{item.monthShort}}</span>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <span style="font-family: Lora, Georgia, serif; font-size: 16px; line-height: 24px; font-weight: 500">{{item.name}}</span>
          <span style="font-size: 14px; line-height: 20px; color: #C7C5D3">{{item.lunar}}</span>
          <span style="font-size: 14px; line-height: 20px; color: #C7C5D3">{{item.solar}}</span>
        </div>
        <div style="flex: none; display: flex; flex-direction: column; align-items: flex-end">
          <span style="font-size: 22px; line-height: 28px; font-weight: 700; color: #C1C1FF">{{item.days}}</span>
          <span style="font-size: 12px; line-height: 16px; color: #C7C5D3">ngày nữa</span>
        </div>
      </article>
    </sc-for>
  </main>

  <a href="FormDark.dc.html" aria-label="Thêm ngày giỗ" style="text-decoration: none; position: absolute; right: 16px; bottom: 16px; height: 56px; padding: 0 24px 0 16px; border: 0; border-radius: 16px; background: #C1C1FF; color: #24227C; font-family: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: 0px 1px 3px 0px rgba(0, 0, 0, 0.3), 0px 4px 8px 3px rgba(0, 0, 0, 0.15)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    Thêm
  </a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { day: '9', monthShort: 'tháng 10', name: 'Bà nội', lunar: '9 tháng 10 âm lịch', solar: 'Thứ Tư, 18/11/2026', days: '12' },
        { day: '3', monthShort: 'tháng 6', name: 'Cụ ông Nguyễn Văn An', lunar: '3 tháng 6 âm lịch', solar: 'Chủ Nhật, 13/12/2026', days: '37' },
        { day: '15', monthShort: 'tháng 8', name: 'Bác cả', lunar: '15 tháng 8 âm lịch', solar: 'Thứ Hai, 15/02/2027', days: '101' }
      ]
    };
  }
}
</script>
</body>
</html>
