<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Giới thiệu 3/3 (tối)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Lora:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin: 0}
a{color:#C1C1FF}a:hover{color:#E1DFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; background: #131318; color: #E4E1E9; font-family: 'Be Vietnam Pro', system-ui, sans-serif; overflow: hidden">
  <header style="height: 64px; flex: none; padding: 0 4px 0 16px; display: flex; align-items: center; justify-content: flex-end">
    <a href="IntroNotifyDark.dc.html" style="height: 48px; padding: 0 12px; border-radius: 24px; color: #C1C1FF; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center">Bỏ qua</a>
  </header>
  <main style="flex: 1; min-height: 0; padding: 0 24px; display: flex; flex-direction: column; align-items: center">
    <div style="flex: 1; width: 100%; display: flex; align-items: center; justify-content: center">
      <div style="width: 320px; height: 320px; border-radius: 160px; background: #1B1B21; display: flex; align-items: center; justify-content: center">
      <div aria-hidden="true" style="width: 280px; padding: 16px; box-sizing: border-box; border-radius: 16px; background: #131318; box-shadow: 0px 1px 3px 0px rgba(0, 0, 0, 0.3), 0px 4px 8px 3px rgba(0, 0, 0, 0.15); display: flex; flex-direction: column; gap: 8px">
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px">
          <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
            <div style="height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
              <span style="{{c.numStyle}}">{{c.n}}</span>
              <span style="{{c.dot}}"></span>
            </div>
          </sc-for>
        </div>
        <div style="display: flex; justify-content: center; gap: 16px; font-size: 12px; line-height: 16px; color: #C7C5D3">
          <span style="display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #C1C1FF"></span>Giỗ</span>
          <span style="display: flex; align-items: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #FFB4A9"></span>Lễ</span>
        </div>
      </div>
      </div>
    </div>
    <div style="padding: 24px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
      <h1 style="margin: 0; font-family: Lora, Georgia, serif; font-size: 28px; line-height: 36px; font-weight: 400">Rằm, mùng 1, lễ Tết</h1>
      <p style="margin: 0; font-size: 16px; line-height: 24px; color: #C7C5D3">Đánh dấu sẵn trên lịch.</p>
    </div>
  </main>
  <footer style="flex: none; padding: 24px 16px; display: flex; align-items: center; justify-content: space-between">
    <div role="img" aria-label="Trang 3 trên 3" style="display: flex; gap: 8px"><span style="height: 8px; border-radius: 4px; width: 8px; background: #464651"></span><span style="height: 8px; border-radius: 4px; width: 8px; background: #464651"></span><span style="height: 8px; border-radius: 4px; width: 24px; background: #C1C1FF"></span></div>
    <a href="IntroNotifyDark.dc.html" style="height: 40px; padding: 0 24px; border-radius: 20px; background: #C1C1FF; color: #24227C; text-decoration: none; font-size: 14px; font-weight: 600; display: flex; align-items: center">Bắt đầu</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {};
  }
  renderVals() {
    const marks = { 6: 'a', 10: 'h', 18: 'a', 24: 'h' };
    const cells = [];
    for (let i = 1; i <= 35; i++) {
      const d = i <= 30 ? i : 0;
      const m = marks[d];
      cells.push({
        n: d ? String(d) : '',
        numStyle: 'font-size: 12px; line-height: 16px; font-weight: ' + (m ? '700' : '400') + '; color: ' + (m === 'h' ? '#FFB4A9' : (m === 'a' ? '#C1C1FF' : '#C7C5D3')),
        dot: 'width: 6px; height: 6px; border-radius: 3px; background: ' + (m === 'a' ? '#C1C1FF' : (m === 'h' ? '#FFB4A9' : 'transparent'))
      });
    }
    return { cells };
  }
}
</script>
</body>
</html>
