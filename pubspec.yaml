name: ever_moon
description: "Evermoon — yearly events on Vietnamese lunar dates with reminders."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.9

  # Localization
  intl: ^0.20.2

  # State management
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # Navigation
  go_router: ^17.2.3

  # Storage & database
  shared_preferences: ^2.5.5
  get_storage: ^2.1.1
  drift: ^2.26.0
  drift_flutter: '>=0.2.0 <0.4.0'
  uuid: ^4.5.1

  # Network
  connectivity_plus: ^7.1.1
  dio: ^5.9.2
  retrofit: ^4.9.2
  pretty_dio_logger: ^1.4.0

  # Fonts

  # Path & permissions
  path_provider: ^2.1.5
  external_path: ^2.2.0
  path: ^1.9.1
  permission_handler: ^12.0.1

  # Browser
  url_launcher: ^6.3.2

  # Local packages
  setting_ui_builder:
    path: packages/setting_ui_builder
  # Reach it only through lib/services/lunar/ (ADR 0002).
  lunar_calendar:
    path: packages/lunar_calendar

  # UI components
  another_flushbar: ^2.2.4
  gap: ^3.0.1
  flutter_local_notifications: ^22.0.1
  fluttertoast: ^9.1.0

  # Animations
  animations: ^2.2.0

  # Markdown
  flutter_markdown_plus: ^1.0.7

  # Device & app info
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.1

  # Environment
  flutter_dotenv: ^5.2.1

  # Utilities
  json_annotation: ^4.12.0
  timezone: ^0.11.0

  # Logging
  logger: ^2.7.0

  # Firebase (FlutterFire)
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  firebase_crashlytics: ^5.2.4
  firebase_auth: ^6.1.1
  firebase_ui_auth: ^3.0.1
  firebase_ui_localizations: ^2.0.1
  firebase_ui_oauth_google: ^2.0.1

  # Native method channel
  pigeon: ^27.1.0

  # Assets picker
  image_picker: ^1.2.2
  file_picker: ^10.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.15.0
  retrofit_generator: ^10.2.5
  json_serializable: ^6.8.0
  drift_dev: ^2.26.0

flutter:
  config:
    enable-swift-package-manager: true
  generate: true
  uses-material-design: true

  licenses:
    - LICENSE

  assets:
    - assets/docs/
    - assets/fonts/
    - assets/env/.env.dev
    - assets/env/.env.prod

  fonts:
    - family: SocialIcons
      fonts:
        - asset: packages/firebase_ui_auth/fonts/SocialIcons.ttf
    # Bundled so text renders offline with full Vietnamese coverage (plan 0005, D7).
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
