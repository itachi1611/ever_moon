# SonarQube Cloud analysis scope. The organization and the project key are not
# written here: CI passes them from the repository variables SONAR_ORGANIZATION
# and SONAR_PROJECT_KEY (docs/ci-cd.md, "Code quality with SonarQube Cloud").
sonar.sourceEncoding=UTF-8

sonar.sources=lib,packages/lunar_calendar/lib
sonar.tests=test,packages/lunar_calendar/test
sonar.test.inclusions=**/*_test.dart

# Generated code is rebuilt in CI before the scan; firebase_options.dart is
# written by flutterfire.
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,lib/generated/**,lib/firebase/**

# flutter test --coverage covers the app only. The engine package has its own
# tests (dart test) that are not part of this report, so it is not counted as
# uncovered.
sonar.dart.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=packages/**,**/*.g.dart,lib/generated/**,lib/firebase/**
