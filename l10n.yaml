# Flutter gen-l10n (replaces the discontinued intl_utils, plan 0003).
# Runs on `fvm flutter pub get` and `fvm flutter run`, or manually with
# `fvm flutter gen-l10n`. Output keeps the old import path and class name,
# so widgets still use `S.of(context)` from lib/generated/l10n.dart.
arb-dir: lib/l10n
template-arb-file: intl_en.arb
output-dir: lib/generated
output-localization-file: l10n.dart
output-class: S
nullable-getter: false
